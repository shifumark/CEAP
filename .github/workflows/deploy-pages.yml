name: Deploy client to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace=client

      - name: Build
        # VITE_API_URL is a repository Variable (Settings > Secrets and
        # variables > Actions > Variables) pointing at the deployed Render
        # backend, e.g. https://scholarship-management-api.onrender.com/api
        run: npm run build --workspace=client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Caps how long a hung deploy-pages step can run before failing fast —
    # without this, a stuck deployment can sit for the default 6h job
    # limit instead of surfacing quickly.
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    # Deliberately a separate job (not a step tacked onto `deploy`) so a
    # failure here shows up as its own red X and triggers GitHub's normal
    # workflow-failure notification — this is the only thing in this repo
    # that automatically flags "the live site is actually broken" instead
    # of relying on a real user noticing and reporting it, which is how
    # the last two production incidents this project had were caught.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check GitHub Pages is serving the new build
        run: |
          url="${{ needs.deploy.outputs.page_url }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "GET $url -> $status"
          if [ "$status" != "200" ]; then
            echo "::error::Pages site returned $status instead of 200 after deploy"
            exit 1
          fi

      - name: Check the Render backend is up
        # VITE_API_URL points at .../api — strip that suffix to hit /health.
        run: |
          api="${{ vars.VITE_API_URL }}"
          health="${api%/api}/health"
          status=$(curl -s -o /dev/null -w "%{http_code}" "$health")
          echo "GET $health -> $status"
          if [ "$status" != "200" ]; then
            echo "::error::Backend health check returned $status — this deploy only covers the client, but a broken backend breaks the whole app regardless."
            exit 1
          fi
